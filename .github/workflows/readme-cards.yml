# Regenerates the images of the profile README once a day:
# - stats and top-languages cards (github-readme-stats action), committed to profile/;
# - the contribution snake (Platane/snk), published to the "output" branch.
# The public github-readme-stats and trophy servers were down on 2026-11-08, so the cards
# are generated here instead of linked live.
name: README cards

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=transparent&hide_border=true&title_color=22D3EE&icon_color=22D3EE&text_color=8FA6B0
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&theme=transparent&hide_border=true&title_color=22D3EE&text_color=8FA6B0
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update README cards" || exit 0
          git push

  snake:
    runs-on: ubuntu-latest
    steps:
      # svg-only runs on Node, so dist/ belongs to the runner and the next step can git init it
      # (the Docker variant writes dist/ as root).
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#0e7490
            dist/snake-dark.svg?palette=github-dark&color_snake=#22d3ee

      - name: Publish to the output branch
        run: |
          cd dist
          git init -q -b output
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .
          git commit -qm "chore: update contribution snake"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" output
